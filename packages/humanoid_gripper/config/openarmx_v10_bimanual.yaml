humanoid_gripper_runtime:
  ros__parameters:
    plugin_class: humanoid_gripper/RosTopicGripperDriver
    platform_gripper_state_topic: /hc_teleop/gripper_states
    platform_gripper_command_topic: /hc_teleop/gripper_commands
    diagnostics_topic: /diagnostics
    command_watchdog_ms: 250.0
    control_frequency_hz: 50.0
    diagnostic_frequency_hz: 10.0

    gripper_names: [left_gripper, right_gripper]
    vendor_gripper_names:
      [openarmx_left_finger_joint1, openarmx_right_finger_joint1]
    position_units: [m, m]
    vendor_to_logical_scales: [1.0, 1.0]
    vendor_to_logical_offsets: [0.0, 0.0]

    # These command topics intentionally belong to gripper-only ros2_control controllers.
    # Do not point them at the seven-axis arm controllers.
    plugin_parameters:
      - feedback_timeout_s=0.5
      - startup_grace_s=15.0
      - left_gripper.command_topic=/left_gripper_controller/commands
      - left_gripper.command_type=float64_multi_array
      - left_gripper.feedback_topic=/joint_states
      - left_gripper.feedback_type=joint_state
      - left_gripper.min_position=0.0
      - left_gripper.max_position=0.044
      - right_gripper.command_topic=/right_gripper_controller/commands
      - right_gripper.command_type=float64_multi_array
      - right_gripper.feedback_topic=/joint_states
      - right_gripper.feedback_type=joint_state
      - right_gripper.min_position=0.0
      - right_gripper.max_position=0.044
