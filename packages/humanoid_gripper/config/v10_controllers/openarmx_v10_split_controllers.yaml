#
# The arm and gripper position interfaces are intentionally owned by different controllers.

/**:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    left_gripper_controller:
      type: forward_command_controller/ForwardCommandController
    right_gripper_controller:
      type: forward_command_controller/ForwardCommandController
    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController
    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

/**/left_forward_position_controller:
  ros__parameters:
    joints:
      - openarmx_left_joint1
      - openarmx_left_joint2
      - openarmx_left_joint3
      - openarmx_left_joint4
      - openarmx_left_joint5
      - openarmx_left_joint6
      - openarmx_left_joint7
    interface_name: position

/**/right_forward_position_controller:
  ros__parameters:
    joints:
      - openarmx_right_joint1
      - openarmx_right_joint2
      - openarmx_right_joint3
      - openarmx_right_joint4
      - openarmx_right_joint5
      - openarmx_right_joint6
      - openarmx_right_joint7
    interface_name: position

/**/left_gripper_controller:
  ros__parameters:
    joints: [openarmx_left_finger_joint1]
    interface_name: position

/**/right_gripper_controller:
  ros__parameters:
    joints: [openarmx_right_finger_joint1]
    interface_name: position

/**/left_forward_effort_controller:
  ros__parameters:
    joints:
      - openarmx_left_joint1
      - openarmx_left_joint2
      - openarmx_left_joint3
      - openarmx_left_joint4
      - openarmx_left_joint5
      - openarmx_left_joint6
      - openarmx_left_joint7
    interface_name: effort

/**/right_forward_effort_controller:
  ros__parameters:
    joints:
      - openarmx_right_joint1
      - openarmx_right_joint2
      - openarmx_right_joint3
      - openarmx_right_joint4
      - openarmx_right_joint5
      - openarmx_right_joint6
      - openarmx_right_joint7
    interface_name: effort
